
<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>約會邀請</title>

    <!-- EmailJS -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <script>
        emailjs.init({
            publicKey: "F-4t6phcbgXnSS0tL"
        });
    </script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, "Microsoft JhengHei", sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 35vh;
            background-color: #f5f5f5;
            background-image: none;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            transition: background-image 0.8s ease;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, 0.25);
            z-index: -1;
        }

        .box {
            background: rgba(255, 255, 255, 0.90);
            width: 85%;
            max-width: 400px;
            padding: 24px 18px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
        }

        h1 {
            font-size: 23px;
            margin-top: 5px;
            margin-bottom: 20px;
        }

        p {
            font-size: 17px;
            margin: 10px 0;
        }

        input[type="password"],
        input[type="date"] {
            font-size: 18px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 10px;
            margin: 10px 0;
            width: 90%;
            max-width: 280px;
        }

        button {
            font-size: 17px;
            padding: 11px 24px;
            margin: 7px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }

        button:hover {
            opacity: 0.88;
            transform: translateY(-1px);
        }

        .yes {
            background: #4CAF50;
            color: white;
        }

        .no {
            background: #f44336;
            color: white;
        }

        .login {
            background: #555;
            color: white;
        }

        .restaurant-button {
            display: block;
            width: 90%;
            max-width: 290px;
            margin: 14px auto;
            padding: 14px 12px;
            background: #fff7f0;
            color: #75452d;
            border: 1px solid #e7c9b6;
            font-size: 19px;
            font-weight: bold;
        }

        .restaurant-link {
            display: inline-block;
            margin-top: 5px;
            color: #3976bd;
            font-size: 14px;
            font-weight: normal;
            text-decoration: underline;
        }

        .restaurant-section,
        .date-section,
        .no-message {
            display: none;
        }

        .message {
            font-size: 21px;
            font-weight: bold;
            margin: 12px 0;
        }

        .warning {
            color: #f44336;
        }

        .success {
            color: #4CAF50;
        }

        .email-status {
            font-size: 14px;
            margin-top: 10px;
            color: #777;
        }

        #wrongPassword {
            color: #f44336;
            display: none;
            font-size: 16px;
        }

        #mainPage {
            display: none;
        }

        @media (max-width: 600px) {
            body {
                padding-top: 35vh;
                background-attachment: scroll;
            }

            .box {
                width: 90%;
                max-width: 360px;
                padding: 20px 14px;
            }

            h1 {
                font-size: 21px;
            }

            p {
                font-size: 16px;
            }

            button {
                font-size: 17px;
                padding: 10px 20px;
            }

            .restaurant-button {
                font-size: 18px;
            }

            .message {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="box">

        <!-- 登入頁面 -->
        <div id="loginPage">
            <h1>🔐 妳的生日(mm/dd)</h1>
            <p>請輸入密碼</p>

            <input
                type="password"
                id="password"
                placeholder="請輸入密碼"
            >

            <br>

            <button class="login" onclick="checkPassword()">
                進入
            </button>

            <p id="wrongPassword">
                密碼錯誤，再試一次 😆
            </p>
        </div>

        <!-- 主要頁面 -->
        <div id="mainPage">

            <!-- 第一步：約會邀請 -->
            <div id="question">
                <h1>妳願意跟我出去約會嗎？</h1>

                <button class="yes" onclick="chooseYes()">
                    是
                </button>

                <button class="no" onclick="chooseNo()">
                    否
                </button>
            </div>

            <!-- 選擇否 -->
            <div id="noMessage" class="no-message">
                <div class="message warning">
                    沒有這個選項 😆
                </div>
                <p>請重新選擇！</p>
            </div>

            <!-- 第二步：選擇餐廳 -->
            <div id="restaurantSection" class="restaurant-section">

                <h1>🍽️ 那我們要吃哪一間？</h1>

                <p>選一間妳喜歡的餐廳吧！</p>

                <button
                    class="restaurant-button"
                    onclick="chooseRestaurant('双円')"
                >
                    双円
                    <br>
                    <a
                        class="restaurant-link"
                        href="https://maps.app.goo.gl/7e7QUrxzC5fKsL6S9"
                        target="_blank"
                        rel="noopener noreferrer"
                        onclick="event.stopPropagation()"
                    >
                        📍 查看餐廳位置
                    </a>
                </button>

                <button
                    class="restaurant-button"
                    onclick="chooseRestaurant('明水然樂')"
                >
                    明水然樂
                    <br>
                    <a
                        class="restaurant-link"
                        href="https://maps.app.goo.gl/ZLGt7aYDXTKk8RK7A"
                        target="_blank"
                        rel="noopener noreferrer"
                        onclick="event.stopPropagation()"
                    >
                        📍 查看餐廳位置
                    </a>
                </button>

                <p style="font-size:14px; color:#777;">
                    點擊餐廳名稱即可選擇，
                    也可以先查看地圖喔！
                </p>
            </div>

            <!-- 第三步：選擇日期 -->
            <div id="dateSection" class="date-section">

                <h1>📅 約會日期</h1>

                <p>妳選擇的餐廳是：</p>

                <div id="selectedRestaurant"
                     class="message success"></div>

                <p>請選擇想約會的日期：</p>

                <input type="date" id="date">

                <br>

                <button class="yes" onclick="confirmDate()">
                    確定日期
                </button>

                <button class="login" onclick="backToRestaurants()">
                    重新選擇餐廳
                </button>

                <div id="result"></div>
            </div>

        </div>
    </div>

    <script>
        /* 密碼 */
        const correctPassword = "1102";

        /* EmailJS 設定 */
        const EMAIL_SERVICE_ID = "service_2v67h7e";
        const EMAIL_TEMPLATE_ID = "template_3ce95it";

        /* 儲存選擇的餐廳 */
        let selectedRestaurant = "";

        /* 登入 */
        function checkPassword() {
            const password =
                document.getElementById("password").value;

            if (password === correctPassword) {

                document.body.style.backgroundImage =
                    'url("first.jpg")';

                document.getElementById("loginPage").style.display =
                    "none";

                document.getElementById("mainPage").style.display =
                    "block";

            } else {
                document.getElementById("wrongPassword").style.display =
                    "block";
            }
        }

        /* Enter 登入 */
        document.getElementById("password").addEventListener(
            "keydown",
            function(event) {
                if (event.key === "Enter") {
                    checkPassword();
                }
            }
        );

        /* 第一步：同意約會 */
        function chooseYes() {
            document.getElementById("question").style.display =
                "none";

            document.getElementById("restaurantSection").style.display =
                "block";
        }

        /* 選擇否 */
        function chooseNo() {
            document.getElementById("question").style.display =
                "none";

            document.getElementById("noMessage").style.display =
                "block";

            setTimeout(function() {
                document.getElementById("noMessage").style.display =
                    "none";

                document.getElementById("question").style.display =
                    "block";
            }, 1500);
        }

        /* 第二步：選擇餐廳 */
        function chooseRestaurant(restaurant) {
            selectedRestaurant = restaurant;

            document.getElementById("restaurantSection").style.display =
                "none";

            document.getElementById("dateSection").style.display =
                "block";

            document.getElementById("selectedRestaurant").textContent =
                restaurant;

            document.getElementById("result").innerHTML = "";
        }

        /* 返回餐廳選擇 */
        function backToRestaurants() {
            document.getElementById("dateSection").style.display =
                "none";

            document.getElementById("restaurantSection").style.display =
                "block";
        }

        /* 第三步：確認日期並寄信 */
        function confirmDate() {
            const date = document.getElementById("date").value;

            if (date === "") {
                document.getElementById("result").innerHTML =
                    '<div class="message warning">' +
                    '請先選擇日期 😆' +
                    '</div>';
                return;
            }

            if (!selectedRestaurant) {
                return;
            }

            const formattedDate = date.replaceAll("-", "/");

            document.getElementById("dateSection").innerHTML =
                '<div class="message success">' +
                '期待跟妳約會 ❤️' +
                '</div>' +

                '<p>餐廳：' + selectedRestaurant + '</p>' +

                '<p>日期：' + formattedDate + '</p>' +

                '<p class="email-status">' +
                '📧 正在寄送通知...' +
                '</p>';

            /* 寄送日期與餐廳 */
            const templateParams = {
                date: formattedDate,
                restaurant: selectedRestaurant
            };

            emailjs.send(
                EMAIL_SERVICE_ID,
                EMAIL_TEMPLATE_ID,
                templateParams
            )
            .then(function(response) {
                console.log(
                    "Email 寄送成功",
                    response.status,
                    response.text
                );

                document.querySelector(".email-status").textContent =
                    "📧 通知已成功寄出！";
            })
            .catch(function(error) {
                console.error("EmailJS 寄送失敗：", error);

                document.querySelector(".email-status").textContent =
                    "⚠️ 通知寄送失敗，請稍後再試。";
            });
        }
    </script>

</body>
</html>
