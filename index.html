```html
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>約會邀請 ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, "Microsoft JhengHei", sans-serif;

            background-image: url("first.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 背景遮罩 */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, 0.35);
            z-index: -1;
        }

        .box {
            background: rgba(255, 255, 255, 0.92);
            width: 90%;
            max-width: 500px;
            padding: 40px 25px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.2);
        }

        h1 {
            font-size: 28px;
            margin-bottom: 30px;
        }

        p {
            font-size: 18px;
        }

        input[type="password"],
        input[type="date"] {
            font-size: 20px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 10px;
            margin: 15px 0;
            width: 80%;
            max-width: 300px;
        }

        button {
            font-size: 20px;
            padding: 12px 35px;
            margin: 10px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        .yes {
            background: #4CAF50;
            color: white;
        }

        .no {
            background: #f44336;
            color: white;
        }

        .login {
            background: #555;
            color: white;
        }

        .date-section {
            display: none;
        }

        .no-message {
            display: none;
        }

        .message {
            font-size: 26px;
            font-weight: bold;
            margin: 20px;
        }

        .warning {
            color: #f44336;
        }

        .success {
            color: #4CAF50;
        }

        #wrongPassword {
            color: #f44336;
            display: none;
            font-size: 18px;
        }

        #mainPage {
            display: none;
        }
    </style>
</head>

<body>

<div class="box">

    <!-- 密碼頁面 -->
    <div id="loginPage">

        <h1>🔐 小小秘密</h1>

        <p>請輸入密碼</p>

        <input
            type="password"
            id="password"
            placeholder="請輸入密碼"
        >

        <br>

        <button class="login" onclick="checkPassword()">
            進入 ❤️
        </button>

        <p id="wrongPassword">
            密碼錯誤，再試一次 😆
        </p>

    </div>


    <!-- 主要問題 -->
    <div id="mainPage">

        <div id="question">

            <h1>妳願意跟我出去約會嗎？ ❤️</h1>

            <button class="yes" onclick="chooseYes()">
                是 ❤️
            </button>

            <button class="no" onclick="chooseNo()">
                否
            </button>

        </div>


        <!-- 選否 -->
        <div id="noMessage" class="no-message">

            <div class="message warning">
                沒有這個選項 😆
            </div>

            <p>請重新選擇！</p>

        </div>


        <!-- 選是 -->
        <div id="dateSection" class="date-section">

            <h1>太好了 ❤️</h1>

            <p>請選擇妳方便的日期：</p>

            <input type="date" id="date">

            <br>

            <button class="yes" onclick="confirmDate()">
                確定日期
            </button>

            <div id="result"></div>

        </div>

    </div>

</div>


<script>

    // 密碼
    const correctPassword = "123456789";


    // 檢查密碼
    function checkPassword() {

        const password =
            document.getElementById("password").value;

        if (password === correctPassword) {

            // 隱藏登入頁面
            document.getElementById("loginPage").style.display = "none";

            // 顯示主要網頁
            document.getElementById("mainPage").style.display = "block";

        } else {

            // 顯示錯誤訊息
            document.getElementById("wrongPassword").style.display = "block";

        }
    }


    // 按 Enter 也可以登入
    document.getElementById("password").addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {
                checkPassword();
            }

        }
    );


    // 選擇「是」
    function chooseYes() {

        document.getElementById("question").style.display = "none";

        document.getElementById("dateSection").style.display = "block";

    }


    // 選擇「否」
    function chooseNo() {

        document.getElementById("question").style.display = "none";

        document.getElementById("noMessage").style.display = "block";


        // 1.5 秒後回到原問題
        setTimeout(function() {

            document.getElementById("noMessage").style.display = "none";

            document.getElementById("question").style.display = "block";

        }, 1500);

    }


    // 確認日期
    function confirmDate() {

        const date =
            document.getElementById("date").value;

        if (date === "") {

            document.getElementById("result").innerHTML =
                '<div class="message warning">請先選擇日期 😆</div>';

            return;
        }


        document.getElementById("result").innerHTML =
            '<div class="message success">好期待跟妳約會 ❤️</div>' +
            '<p>日期：' + date + '</p>';

    }

</script>

</body>
</html>
```
