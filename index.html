```html
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>約會選擇</title>

    <style>
        body {
            font-family: Arial, "Microsoft JhengHei", sans-serif;
            background: #f7f7f7;
            text-align: center;
            padding-top: 100px;
        }

        .box {
            background: white;
            max-width: 500px;
            margin: auto;
            padding: 40px 25px;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            font-size: 28px;
            margin-bottom: 30px;
        }

        button {
            font-size: 20px;
            padding: 12px 35px;
            margin: 10px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        .yes {
            background: #4CAF50;
            color: white;
        }

        .no {
            background: #f44336;
            color: white;
        }

        .date-section {
            display: none;
        }

        input[type="date"] {
            font-size: 20px;
            padding: 10px;
            margin: 20px;
        }

        .message {
            font-size: 26px;
            font-weight: bold;
            margin: 20px;
        }

        .warning {
            color: #f44336;
        }

        .success {
            color: #4CAF50;
        }
    </style>
</head>

<body>

<div class="box">

    <!-- 第一題 -->
    <div id="question">
        <h1>妳願意跟我出去約會嗎？</h1>

        <button class="yes" onclick="chooseYes()">是 ❤️</button>

        <button class="no" onclick="chooseNo()">否</button>
    </div>


    <!-- 選否後顯示 -->
    <div id="noMessage" style="display:none;">
        <div class="message warning">
            沒有這個選項 😆
        </div>
        <p>請重新選擇！</p>
    </div>


    <!-- 選是後顯示日期 -->
    <div id="dateSection" class="date-section">

        <h1>太好了 ❤️</h1>

        <p>請選擇妳方便的日期：</p>

        <input type="date" id="date">

        <br>

        <button class="yes" onclick="confirmDate()">
            確定日期
        </button>

        <div id="result"></div>

    </div>

</div>


<script>

    // 選擇「是」
    function chooseYes() {

        document.getElementById("question").style.display = "none";

        document.getElementById("dateSection").style.display = "block";
    }


    // 選擇「否」
    function chooseNo() {

        document.getElementById("question").style.display = "none";

        document.getElementById("noMessage").style.display = "block";

        // 1.5 秒後回到原問題
        setTimeout(function() {

            document.getElementById("noMessage").style.display = "none";

            document.getElementById("question").style.display = "block";

        }, 1500);
    }


    // 確認日期
    function confirmDate() {

        let date = document.getElementById("date").value;

        if (date === "") {

            document.getElementById("result").innerHTML =
                '<div class="message warning">請先選擇日期 😆</div>';

            return;
        }

        document.getElementById("result").innerHTML =
            '<div class="message success">好期待跟妳約會 ❤️</div>' +
            '<p>日期：' + date + '</p>';
    }

</script>

</body>
</html>
```
