
<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>約會邀請</title>

    <!-- EmailJS -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <script>
        emailjs.init({
            publicKey: "F-4t6phcbgXnSS0tL"
        });
    </script>

    <style>
        * {
            box-sizing: border-box;
        }

        /* =========================
           整個網頁與背景照片
        ========================= */

        body {
            font-family: Arial, "Microsoft JhengHei", sans-serif;
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: flex-start;

            /*
              調整視窗位置：
              數值越大，白色視窗越往下。
            */
            padding: 58vh 0 30px;

            background-color: #f5f5f5;
            background-image: none;
            background-size: cover;

            /* 優先保留照片上方 */
            background-position: center top;

            background-repeat: no-repeat;
            background-attachment: fixed;
            background-attachment: scroll;

            position: relative;
            isolation: isolate;
        }

        /* 背景照片的淡色遮罩 */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, 0.18);
            z-index: -1;
            pointer-events: none;
        }

        /* =========================
           白色內容視窗
        ========================= */

        .box {
            background: rgba(255, 255, 255, 0.91);

            width: 88%;
            max-width: 400px;

            padding: 22px 18px;
            margin: 0 auto 24px;

            border-radius: 16px;
            text-align: center;

            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.20);

            /* 依照內容自動調整高度 */
            height: auto;
            min-height: 0;
        }

        h1 {
            font-size: 23px;
            line-height: 1.5;
            margin: 5px 0 20px;
        }

        p {
            font-size: 17px;
            line-height: 1.6;
            margin: 10px 0;
        }

        /* =========================
           輸入欄位
        ========================= */

        input[type="password"],
        input[type="date"] {
            font-family: inherit;
            font-size: 18px;

            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 10px;

            margin: 10px 0;
            width: 90%;
            max-width: 280px;

            background: #fff;
        }

        /* =========================
           按鈕
        ========================= */

        button {
            font-family: inherit;
            font-size: 17px;

            padding: 11px 24px;
            margin: 7px;

            border: none;
            border-radius: 10px;

            cursor: pointer;
            transition: opacity 0.2s, transform 0.2s;
        }

        button:hover {
            opacity: 0.88;
            transform: translateY(-1px);
        }

        button:focus-visible,
        a:focus-visible {
            outline: 3px solid #5b9dd9;
            outline-offset: 3px;
        }

        .yes {
            background: #4CAF50;
            color: white;
        }

        .no {
            background: #f44336;
            color: white;
        }

        .login {
            background: #555;
            color: white;
        }

        /* =========================
           餐廳選擇按鈕
        ========================= */

        .restaurant-button {
            display: block;

            width: 100%;
            max-width: 300px;

            margin: 15px auto;
            padding: 15px 12px;

            background: #fff7f0;
            color: #75452d;

            border: 1px solid #e7c9b6;
            border-radius: 12px;

            font-size: 19px;
            font-weight: bold;
        }

        .restaurant-link {
            display: inline-block;
            margin-top: 7px;

            color: #3976bd;
            font-size: 14px;
            font-weight: normal;

            text-decoration: underline;
        }

        .restaurant-hint {
            color: #777;
            font-size: 14px;
        }

        /* =========================
           各頁面初始顯示狀態
        ========================= */

        #mainPage,
        #restaurantSection,
        #dateSection,
        #noMessage {
            display: none;
        }

        /* =========================
           提示訊息
        ========================= */

        .message {
            font-size: 21px;
            font-weight: bold;
            line-height: 1.6;
            margin: 12px 0;
        }

        .warning {
            color: #f44336;
        }

        .success {
            color: #4CAF50;
        }

        .email-status {
            color: #777;
            font-size: 14px;
            margin-top: 12px;
            overflow-wrap: anywhere;
        }

        #wrongPassword {
            color: #f44336;
            display: none;
            font-size: 16px;
        }

        /* =========================
           手機版
        ========================= */

        @media (max-width: 600px) {
            body {
                /*
                  手機版也將視窗放在偏下方。
                  可依照片中臉部位置微調。
                */
                padding-top: 58vh;
                padding-bottom: 24px;

                background-attachment: scroll;
                background-position: center top;
            }

            .box {
                width: 90%;
                max-width: 360px;
                padding: 20px 15px;
                border-radius: 15px;
            }

            h1 {
                font-size: 21px;
                margin-bottom: 16px;
            }

            p {
                font-size: 16px;
            }

            button {
                font-size: 17px;
                padding: 10px 20px;
                margin: 6px;
            }

            input[type="password"],
            input[type="date"] {
                font-size: 17px;
                width: 95%;
            }

            .restaurant-button {
                font-size: 18px;
                padding: 14px 10px;
            }

            .message {
                font-size: 20px;
            }
        }

        /* 螢幕高度較矮時，避免內容太難操作 */
        @media (max-height: 650px) {
            body {
                padding-top: 30vh;
            }
        }
    </style>
</head>

<body>

    <div class="box">

        <!-- =========================
             登入頁面
        ========================= -->

        <div id="loginPage">

            <h1>🔐 妳的生日(mm/dd)</h1>

            <p>請輸入密碼</p>

            <input
                type="password"
                id="password"
                placeholder="請輸入密碼"
                autocomplete="off"
            >

            <br>

            <button
                class="login"
                onclick="checkPassword()"
            >
                進入
            </button>

            <p id="wrongPassword">
                密碼錯誤，再試一次 😆
            </p>

        </div>

        <!-- =========================
             主要頁面
        ========================= -->

        <div id="mainPage">

            <!-- 第一步：約會邀請 -->

            <div id="question">

                <h1>妳願意跟我出去約會嗎？</h1>

                <button
                    class="yes"
                    onclick="chooseYes()"
                >
                    是 ❤️
                </button>

                <button
                    class="no"
                    onclick="chooseNo()"
                >
                    否
                </button>

            </div>

            <!-- 選擇否 -->

            <div id="noMessage" aria-live="polite">

                <div class="message warning">
                    沒有這個選項 😆
                </div>

                <p>請重新選擇！</p>

            </div>

            <!-- 第二步：選擇餐廳 -->

            <div id="restaurantSection">

                <h1>🍽️ 那我們要吃哪一間？</h1>

                <p>選一間妳喜歡的餐廳吧！❤️</p>

                <button
                    class="restaurant-button"
                    onclick="chooseRestaurant('双円')"
                >
                    双円

                    <br>

                    <a
                        class="restaurant-link"
                        href="https://maps.app.goo.gl/7e7QUrxzC5fKsL6S9"
                        target="_blank"
                        rel="noopener noreferrer"
                        onclick="event.stopPropagation()"
                    >
                        📍 查看餐廳位置
                    </a>
                </button>

                <button
                    class="restaurant-button"
                    onclick="chooseRestaurant('明水然樂')"
                >
                    明水然樂

                    <br>

                    <a
                        class="restaurant-link"
                        href="https://maps.app.goo.gl/ZLGt7aYDXTKk8RK7A"
                        target="_blank"
                        rel="noopener noreferrer"
                        onclick="event.stopPropagation()"
                    >
                        📍 查看餐廳位置
                    </a>
                </button>

                <p class="restaurant-hint">
                    可以先看看餐廳位置，再決定要吃哪一間喔！
                </p>

            </div>

            <!-- 第三步：選擇日期 -->

            <div id="dateSection">

                <h1>📅 約會日期</h1>

                <p>妳選擇的餐廳是：</p>

                <div
                    id="selectedRestaurant"
                    class="message success"
                ></div>

                <p>請選擇想約會的日期：</p>

                <input
                    type="date"
                    id="date"
                >

                <br>

                <button
                    class="yes"
                    onclick="confirmDate()"
                >
                    確定日期 ❤️
                </button>

                <br>

                <button
                    class="login"
                    onclick="backToRestaurants()"
                >
                    重新選擇餐廳
                </button>

                <div id="result" aria-live="polite"></div>

            </div>

        </div>

    </div>

    <script>
        /* =========================
           密碼
        ========================= */

        const correctPassword = "1102";

        /* =========================
           EmailJS 設定
        ========================= */

        const EMAIL_SERVICE_ID = "service_2v67h7e";
        const EMAIL_TEMPLATE_ID = "template_3ce95it";

        /* 儲存餐廳選擇 */
        let selectedRestaurant = "";

        /* 避免重複點擊造成重複寄信 */
        let isSendingEmail = false;

        /* =========================
           登入
        ========================= */

        function checkPassword() {
            const password =
                document.getElementById("password").value;

            if (password === correctPassword) {

                document.body.style.backgroundImage =
                    'url("first.jpg")';

                document.getElementById("loginPage").style.display =
                    "none";

                document.getElementById("mainPage").style.display =
                    "block";

                document.getElementById("wrongPassword").style.display =
                    "none";

            } else {

                document.getElementById("wrongPassword").style.display =
                    "block";

            }
        }

        /* Enter 登入 */
        document.getElementById("password").addEventListener(
            "keydown",
            function(event) {
                if (event.key === "Enter") {
                    checkPassword();
                }
            }
        );

        /* =========================
           第一步：同意約會
        ========================= */

        function chooseYes() {
            document.getElementById("question").style.display =
                "none";

            document.getElementById("restaurantSection").style.display =
                "block";
        }

        /* =========================
           選擇否
        ========================= */

        function chooseNo() {
            document.getElementById("question").style.display =
                "none";

            document.getElementById("noMessage").style.display =
                "block";

            setTimeout(function() {
                document.getElementById("noMessage").style.display =
                    "none";

                document.getElementById("question").style.display =
                    "block";
            }, 1500);
        }

        /* =========================
           第二步：選擇餐廳
        ========================= */

        function chooseRestaurant(restaurant) {
            selectedRestaurant = restaurant;

            document.getElementById("restaurantSection").style.display =
                "none";

            document.getElementById("dateSection").style.display =
                "block";

            document.getElementById("selectedRestaurant").textContent =
                restaurant;

            document.getElementById("result").textContent = "";
        }

        /* 返回餐廳選擇 */
        function backToRestaurants() {
            document.getElementById("dateSection").style.display =
                "none";

            document.getElementById("restaurantSection").style.display =
                "block";
        }

        /* =========================
           第三步：確認日期並寄信
        ========================= */

        async function confirmDate() {
            const date =
                document.getElementById("date").value;

            const result =
                document.getElementById("result");

            if (!date) {
                result.innerHTML =
                    '<div class="message warning">' +
                    '請先選擇日期 😆' +
                    '</div>';
                return;
            }

            if (!selectedRestaurant) {
                return;
            }

            if (isSendingEmail) {
                return;
            }

            const formattedDate = date.replaceAll("-", "/");

            /* 顯示確認結果 */
            document.getElementById("dateSection").innerHTML =
                '<div class="message success">' +
                '期待跟妳約會 ❤️' +
                '</div>' +

                '<p>餐廳：' +
                escapeHTML(selectedRestaurant) +
                '</p>' +

                '<p>日期：' +
                escapeHTML(formattedDate) +
                '</p>' +

                '<p id="emailStatus" class="email-status" aria-live="polite">' +
                '📧 正在寄送通知...' +
                '</p>';

            const emailStatus =
                document.getElementById("emailStatus");

            const templateParams = {
                date: formattedDate,
                restaurant: selectedRestaurant
            };

            isSendingEmail = true;

            try {
                await emailjs.send(
                    EMAIL_SERVICE_ID,
                    EMAIL_TEMPLATE_ID,
                    templateParams
                );

                emailStatus.textContent =
                    "📧 通知已成功寄出！";

            } catch (error) {
                console.error("EmailJS 寄送失敗：", error);

                emailStatus.textContent =
                    "⚠️ 通知寄送失敗，請稍後再確認。";

            } finally {
                isSendingEmail = false;
            }
        }

        /* 避免將文字當成 HTML 插入頁面 */
        function escapeHTML(value) {
            return String(value).replace(/[&<>"']/g, function(char) {
                const entities = {
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#39;"
                };

                return entities[char];
            });
        }
    </script>

</body>

</html>
