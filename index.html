<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>是與否日期選擇</title>
<style>
    body {
        font-family: "Microsoft JhengHei", Arial, sans-serif;
        background: #f5f5f5;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
    }
    .box {
        background: white;
        width: min(90%, 420px);
        padding: 30px;
        border-radius: 16px;
        box-shadow: 0 4px 18px rgba(0,0,0,.12);
        text-align: center;
    }
    h1 {
        margin-top: 0;
        font-size: 24px;
    }
    .question {
        font-size: 20px;
        margin: 25px 0 15px;
    }
    button {
        font-size: 18px;
        padding: 12px 30px;
        margin: 8px;
        border: 1px solid #ccc;
        border-radius: 10px;
        background: white;
        cursor: pointer;
    }
    button:hover, button.selected {
        background: #e9e9e9;
    }
    #dateArea {
        display: none;
        margin-top: 25px;
    }
    input[type="date"] {
        font-size: 18px;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 8px;
    }
    #result {
        margin-top: 20px;
        font-size: 17px;
        font-weight: bold;
    }
</style>
</head>
<body>

<div class="box">
    <h1>簡易選擇</h1>

    <div class="question">你願意跟我出去約會嗎？</div>

    <button id="yesBtn" onclick="choose('是')">是</button>
    <button id="noBtn" onclick="choose('否')">否</button>

    <div id="dateArea">
        <div class="question">請選擇日期</div>
        <input type="date" id="date" onchange="showResult()">
    </div>

    <div id="result"></div>
</div>

<script>
function choose(answer) {
    document.getElementById("yesBtn").classList.remove("selected");
    document.getElementById("noBtn").classList.remove("selected");

    if (answer === "是") {
        document.getElementById("yesBtn").classList.add("selected");
        document.getElementById("dateArea").style.display = "block";
        document.getElementById("result").textContent = "";
    } else {
        document.getElementById("noBtn").classList.add("selected");
        document.getElementById("dateArea").style.display = "none";
        document.getElementById("date").value = "";
        document.getElementById("result").textContent = "你選擇了：否";
    }
}

function showResult() {
    const date = document.getElementById("date").value;
    if (date) {
        document.getElementById("result").textContent =
            "你選擇了：是，日期是 " + date;
    }
}
</script>

</body>
</html>
